<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fff7e6"/>

  <!-- Decorative grid dots -->
  <g fill="#e8d9c0" opacity="0.6">
    <circle cx="80" cy="80" r="3"/><circle cx="160" cy="80" r="3"/><circle cx="240" cy="80" r="3"/>
    <circle cx="80" cy="160" r="3"/><circle cx="160" cy="160" r="3"/><circle cx="240" cy="160" r="3"/>
    <circle cx="1040" cy="450" r="3"/><circle cx="1120" cy="450" r="3"/>
    <circle cx="1040" cy="530" r="3"/><circle cx="1120" cy="530" r="3"/>
  </g>

  <!-- Large folder illustration (right side) -->
  <!-- folder body -->
  <rect x="720" y="160" width="360" height="280" rx="18" fill="#ffce63" stroke="#283149" stroke-width="4"/>
  <!-- folder tab -->
  <rect x="720" y="120" width="140" height="60" rx="12" fill="#ff8f56" stroke="#283149" stroke-width="4"/>
  <!-- folder divider line -->
  <line x1="720" y1="178" x2="1080" y2="178" stroke="#283149" stroke-width="3"/>
  <!-- folder shadow -->
  <rect x="728" y="168" width="360" height="280" rx="18" fill="none" stroke="#283149" stroke-width="4" opacity="0.15" transform="translate(10,10)"/>

  <!-- Lines inside folder (file rows) -->
  <rect x="752" y="210" width="200" height="12" rx="6" fill="#283149" opacity="0.15"/>
  <rect x="752" y="238" width="260" height="12" rx="6" fill="#283149" opacity="0.15"/>
  <rect x="752" y="266" width="180" height="12" rx="6" fill="#283149" opacity="0.15"/>
  <rect x="752" y="294" width="230" height="12" rx="6" fill="#283149" opacity="0.15"/>
  <rect x="752" y="322" width="160" height="12" rx="6" fill="#283149" opacity="0.15"/>
  <rect x="752" y="350" width="210" height="12" rx="6" fill="#283149" opacity="0.15"/>

  <!-- Brand pill -->
  <rect x="100" y="100" width="310" height="52" rx="12" fill="#fff" stroke="#283149" stroke-width="3"/>
  <!-- mini folder icon in pill -->
  <rect x="118" y="118" width="34" height="22" rx="4" fill="#ffce63" stroke="#283149" stroke-width="2.5"/>
  <rect x="118" y="112" width="14" height="10" rx="3" fill="#ff8f56" stroke="#283149" stroke-width="2"/>
  <text x="162" y="130" font-family="monospace" font-size="16" font-weight="700" fill="#8a9abc">/users/</text>
  <text x="246" y="130" font-family="monospace" font-size="16" font-weight="800" fill="#283149">yesha_raval</text>

  <!-- Main headline -->
  <text x="100" y="230" font-family="Georgia, serif" font-size="72" font-weight="900" fill="#283149" letter-spacing="-3">My work,</text>
  <text x="100" y="315" font-family="Georgia, serif" font-size="72" font-weight="900" fill="#283149" letter-spacing="-3">filed neatly.</text>

  <!-- Subtitle tags -->
  <!-- Tag 1 -->
  <rect x="100" y="355" width="178" height="36" rx="8" fill="#ffce63" stroke="#283149" stroke-width="2.5"/>
  <text x="120" y="378" font-family="monospace" font-size="13" font-weight="700" fill="#283149">AI/ML Engineer</text>

  <!-- Tag 2 -->
  <rect x="292" y="355" width="196" height="36" rx="8" fill="#ff8f56" stroke="#283149" stroke-width="2.5"/>
  <text x="312" y="378" font-family="monospace" font-size="13" font-weight="700" fill="#283149">3× AWS Certified</text>

  <!-- Tag 3 -->
  <rect x="502" y="355" width="174" height="36" rx="8" fill="#fff" stroke="#283149" stroke-width="2.5"/>
  <text x="522" y="378" font-family="monospace" font-size="13" font-weight="700" fill="#283149">Published Researcher</text>

  <!-- Bottom path badge -->
  <rect x="100" y="470" width="236" height="34" rx="7" fill="#ff8f56" stroke="#283149" stroke-width="2.5"/>
  <text x="118" y="492" font-family="monospace" font-size="13" font-weight="600" fill="#283149">~/portfolio</text>
</svg>
